 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SocialScran | Discover Food Worth Sharing</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">

<style>
* {
  box-sizing: border-box;
}

:root {
  font-family: Arial, Helvetica, sans-serif;
  --orange: #ff7540;
  --background: #ffffff;
  --surface: #f4f4f4;
  --text: #222222;
  --muted: #777777;
  --border: #e5e5e5;
  --selected: #171717;
  --selected-text: #ffffff;
  --shadow: 0 4px 18px rgba(0,0,0,.12);
  color-scheme: light;
}

:root[data-theme="dark"] {
  --background: #1c1c1e;
  --surface: #2b2b2e;
  --text: #f5f5f5;
  --muted: #aaaaaa;
  --border: #3a3a3d;
  --selected: #ff7540;
  --selected-text: #171717;
  --shadow: 0 4px 18px rgba(0,0,0,.35);
  color-scheme: dark;
}

body {
  margin: 0;
  overflow: hidden;
  background: var(--background);
  color: var(--text);
}

button, input, select {
  font: inherit;
}

button, a, select {
  -webkit-tap-highlight-color: transparent;
}

button {
  cursor: pointer;
}

button:focus-visible,
a:focus-visible,
select:focus-visible,
input:focus-visible {
  outline: 3px solid var(--orange);
  outline-offset: 2px;
}

#map {
  position: absolute;
  inset: 0;
}

.top-ui {
  position: absolute;
  top: max(12px, env(safe-area-inset-top));
  left: 12px;
  right: 12px;
  z-index: 5;
  max-width: 540px;
  pointer-events: none;
}

.top-ui > * {
  pointer-events: auto;
}

.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
}

.brand {
  background: #171717;
  color: white;
  border-radius: 14px;
  padding: 12px 15px;
  font-size: 24px;
  font-weight: 800;
  box-shadow: var(--shadow);
}

.brand span {
  color: var(--orange);
}

.version {
  display: block;
  font-size: 10px;
  font-weight: 500;
  color: #bbbbbb;
  margin-top: 3px;
  letter-spacing: .5px;
}

.theme-control {
  background: var(--background);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px;
  color: var(--text);
  box-shadow: var(--shadow);
  font-size: 12px;
}

.search {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 16px;
  font-size: 16px;
  color: var(--text);
  background: var(--background);
  box-shadow: var(--shadow);
  outline: none;
}

.search::placeholder {
  color: var(--muted);
}

.city-filters {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 4px;
}

.city-filters::-webkit-scrollbar {
  display: none;
}

.pill {
  border: 1px solid var(--border);
  background: var(--background);
  color: var(--text);
  border-radius: 25px;
  padding: 10px 15px;
  white-space: nowrap;
  font-size: 14px;
}

.city-filters .pill {
  box-shadow: var(--shadow);
}

.pill.active {
  background: var(--selected);
  color: var(--selected-text);
  border-color: var(--selected);
}

#status {
  display: none;
  margin-top: 8px;
  background: var(--background);
  color: var(--text);
  border-radius: 10px;
  padding: 12px;
  font-size: 13px;
  box-shadow: var(--shadow);
}

.restaurant-marker {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 43px;
  height: 43px;
  border-radius: 50%;
  background: var(--orange);
  border: 3px solid white;
  font-size: 23px;
  box-shadow: 0 3px 10px rgba(0,0,0,.3);
  cursor: pointer;
}

.restaurant-marker.selected {
  background: #171717;
  border-color: var(--orange);
}

.restaurant-marker.popular {
  width: 48px;
  height: 48px;
}

.panel {
  position: absolute;
  z-index: 10;
  top: 12px;
  bottom: 12px;
  right: 12px;
  width: min(540px, 45vw);
  background: var(--background);
  border-radius: 20px;
  box-shadow: var(--shadow);
  display: none;
  flex-direction: column;
  overflow: hidden;
}

.panel.open {
  display: flex;
}

.panel-header {
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.panel-header strong {
  font-size: 13px;
  color: var(--muted);
}

.panel-actions {
  display: flex;
  gap: 8px;
}

.round-button {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: var(--surface);
  color: var(--text);
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.drag-area {
  display: none;
}

.panel-content {
  padding: 16px;
  overflow-y: auto;
  overscroll-behavior: contain;
  flex: 1;
  min-height: 0;
}

.restaurant-name {
  margin: 0 0 7px;
  font-size: 23px;
  line-height: 1.25;
}

.restaurant-category {
  font-size: 14px;

  margin-bottom: 14px;
}

.detail {
  font-size: 14px;

  margin: 7px 0;
  overflow-wrap: anywhere;
}

.demo-note {
  background: var(--surface);
  color: var(--muted);
  padding: 12px;
  border-radius: 10px;
  font-size: 13px;
  margin-top: 12px;
}

.directions {
  display: block;
  margin-top: 15px;
  padding: 14px;
  border-radius: 12px;
  background: var(--orange);
  color: #171717;
  font-weight: bold;
  text-align: center;
  text-decoration: none;
}

.website-link {
  display: block;
  text-align: center;
  margin-top: 12px;
  color: var(--text);
  font-size: 14px;
}

.review-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 22px 0 14px;
}

.review-heading h2 {
  font-size: 21px;
  margin: 0;
}

.review-heading span {
  font-size: 13px;
  color: var(--muted);
}

.video-filters {
  display: flex;
  gap: 7px;
  margin-bottom: 15px;
}

.video-filters .pill {
  font-size: 13px;
  padding: 9px 13px;
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 12px;
}

.video-card {
  border: 1px solid var(--border);
  border-radius: 13px;
  overflow: hidden;
  background: var(--surface);
  min-width: 0;
}

.video-frame {
  position: relative;
  aspect-ratio: 9 / 16;
  width: 100%;
  background: #000;
  overflow: hidden;
}

.video-frame iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

.video-info {
  padding: 9px;
}

.creator-name {
  font-size: 12px;
  font-weight: bold;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.platform-label {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}

.video-actions {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-top: 10px;
}

.expand-button {
  width: 100%;
  border: 0;
  border-radius: 8px;
  padding: 9px 5px;
  background: var(--selected);
  color: var(--selected-text);
  font-size: 12px;
}

.original-link {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  text-decoration: none;
  padding: 4px;
}

.empty {
  grid-column: 1 / -1;
  color: var(--muted);
  background: var(--surface);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  font-size: 14px;
}

.video-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(0,0,0,.96);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  padding-top: max(16px, env(safe-area-inset-top));
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.video-modal.open {
  display: flex;
}

.modal-header {
  width: min(100%, 440px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  color: white;
  margin-bottom: 12px;
  font-size: 14px;
}

.modal-close {
  border: 0;
  background: #333;
  color: white;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  font-size: 22px;
  flex-shrink: 0;
}

#modal-player {
  width: min(100%, 440px, 39dvh);
  aspect-ratio: 9 / 16;
  max-height: 75dvh;
  background: black;
}

#modal-player iframe {
  border: 0;
  width: 100%;
  height: 100%;
}

#modal-original {
  color: white;
  margin-top: 14px;
  font-size: 13px;
  text-decoration: none;
}

#map-error {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  z-index: 4;
  background: var(--background);
  color: var(--text);
  padding: 20px;
  border-radius: 14px;
  box-shadow: var(--shadow);
  width: 80%;
  max-width: 350px;
  text-align: center;
}

.maplibregl-ctrl-bottom-right {
  bottom: max(10px, env(safe-area-inset-bottom));
}

.maplibregl-ctrl-bottom-left {
  bottom: max(3px, env(safe-area-inset-bottom));
}

@media (min-width: 701px) {
  .resize-button {
    display: none;
  }
}

@media (max-width: 700px) {
  .brand {
    font-size: 22px;
  }

  .top-ui {
    max-width: none;
  }

  .panel {
    top: auto;
    right: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 74dvh;
    border-radius: 22px 22px 0 0;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .panel.short {
    height: 38dvh;
  }

  .panel.tall {
    height: 96dvh;
  }

  .drag-area {
    display: flex;
    justify-content: center;
    padding: 9px 0 4px;
    flex-shrink: 0;
    touch-action: none;
    cursor: grab;
  }

  .drag-handle {
    width: 44px;
    height: 5px;
    border-radius: 10px;
    background: #aaaaaa;
  }

  .panel-header {
    padding-top: 6px;
  }

  .panel-content {
    padding: 15px;
  }

  .city-filters .pill {
    padding: 10px 13px;
    font-size: 13px;
  }
}
 .restaurant-marker,.restaurant-marker.popular,.restaurant-marker.selected {width:24px;height:32px;background:transparent;border:0;border-radius:0;box-shadow:none;padding:0;position:absolute;overflow:visible;}

.restaurant-marker.selected::after {outline:3px solid var(--orange);outline-offset:2px;}

.brand-row{margin-bottom:7px;gap:6px}.brand{font-size:19px;padding:9px 10px;border-radius:10px;white-space:nowrap}.header-actions{display:flex;gap:5px;align-items:center}.header-actions .theme-control{padding:9px 7px;min-height:40px;white-space:nowrap}.search{padding:10px 12px;border-radius:12px}.compact-menu{background:var(--background);color:var(--text);padding:12px;margin-top:7px;border-radius:12px;box-shadow:var(--shadow);max-height:55dvh;overflow:auto}.compact-menu[hidden]{display:none}.compact-menu .city-filters{flex-wrap:wrap;margin:8px 0 12px}.compact-menu .pill{font-size:13px;padding:8px 11px}#tag-buttons{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.filter-actions{display:flex;justify-content:space-between;gap:6px}.legend{display:flex;gap:10px;flex-wrap:wrap;margin:9px 0;font-size:12px}#map-info small{color:var(--muted)}@media(max-width:370px){.brand{font-size:16px;padding:8px 5px}.header-actions .theme-control{padding:8px 5px;font-size:11px}.top-ui{left:8px;right:8px}}
</style>
</head>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script>

const SUPABASE_URL =
  "https://ptpeqcbuiexoogsqskat.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_EHd_48_rqLUurrLqHY_DeQ_i2oBwa9J";

const LIGHT_MAP =
  "https://tiles.openfreemap.org/styles/liberty";

const DARK_MAP =
  "https://tiles.openfreemap.org/styles/dark";

const cities = {
  All: {
    center: [-2.85, 53.43],
    zoom: 9
  },
  Manchester: {
    center: [-2.2446, 53.4808],
    zoom: 12
  },
  Liverpool: {
    center: [-2.9785, 53.4084],
    zoom: 12
  },
  Warrington: {
    center: [-2.5874, 53.3900],
    zoom: 12
  }
};

const FOOD_TAGS = ["British", "American", "Italian", "Indian", "Chinese", "Japanese", "Korean", "Thai", "Mexican", "Turkish", "Brazilian", "Greek", "Caribbean", "Vietnamese", "Middle Eastern", "Burgers", "Pizza", "Steak", "Sandwiches", "Sushi", "Pasta", "Seafood", "BBQ", "Fried Chicken", "Desserts", "Breakfast", "Street Food", "Fine Dining", "Buffet", "Takeaway", "Caf\u00e9", "Pub Food", "Casual Dining", "Halal", "Vegan", "Vegetarian", "Gluten Free"];
function tagsFrom(value) { return String(value || "").split(/[,;]+/).map(t => t.trim()).filter(Boolean).map(t => FOOD_TAGS.find(x => x.toLowerCase() === t.toLowerCase()) || ({burger:"Burgers",sandwich:"Sandwiches",english:"British",barbecue:"BBQ",cafe:"Café"}[t.toLowerCase()]) || t); }
let selectedTags = new Set();
let shuffledVideos = [];
let restaurants = [];
let markers = [];
let selectedRestaurant = null;
let selectedCity = "All";
let selectedPlatform = "tiktok";
let mapReady = false;
let databaseReady = false;
let databaseFailed = false;

const panel = document.getElementById("panel");
const panelContent = document.getElementById("panel-content");
const videoGrid = document.getElementById("video-grid");
const search = document.getElementById("search");
const statusBox = document.getElementById("status");
const themeSelect = document.getElementById("theme-select");
const videoModal = document.getElementById("video-modal");

const systemTheme =
  window.matchMedia("(prefers-color-scheme: dark)");

let themePreference = "system";

try {
  themePreference =
    localStorage.getItem("socialscran-theme") || "system";
} catch (error) {}

if (!["system", "light", "dark"].includes(themePreference)) {
  themePreference = "system";
}

themeSelect.value = themePreference;

function effectiveTheme() {
  if (themePreference === "system") {
    return systemTheme.matches ? "dark" : "light";
  }

  return themePreference;
}

let currentTheme = effectiveTheme();

document.documentElement.dataset.theme = currentTheme;

const map = new maplibregl.Map({
  container: "map",
  style: currentTheme === "dark" ? DARK_MAP : LIGHT_MAP,
  center: cities.All.center,
  zoom: cities.All.zoom,
  minZoom: 4,
  maxZoom: 19,
  attributionControl: true
});

map.addControl(
  new maplibregl.NavigationControl({
    showCompass: false
  }),
  "bottom-right"
);

map.addControl(
  new maplibregl.GeolocateControl({
    positionOptions: {
      enableHighAccuracy: true
    },
    trackUserLocation: false,
    showUserLocation: true
  }),
  "bottom-right"
);

function simplifyMap() {

  const style = map.getStyle();

  if (!style || !style.layers) return;

  style.layers.forEach(layer => {

    const sourceLayer =
      String(layer["source-layer"] || "").toLowerCase();

    const id = layer.id.toLowerCase();

    const hiddenSources = [
      "poi",
      "transit",
      "aerodrome_label",
      "housenumber",
      "mountain_peak"
    ];

    const hide =
      hiddenSources.includes(sourceLayer) ||
      /poi|restaurant|amenity|hotel|shop|railway|transit|housenumber|airport.label|aerodrome.label/.test(id);

    if (hide) {
      try {
        map.setLayoutProperty(
          layer.id,
          "visibility",
          "none"
        );
      } catch (error) {}
    }

  });

}

map.on("style.load", simplifyMap);

map.on("load", () => {
  mapReady = true;

  document.getElementById("map-error")
    .style.display = "none";

  simplifyMap();
  renderMarkers();
});

map.on("zoomend", renderMarkers);

map.on("error", event => {
  console.warn("Map:", event.error);
});

function applyTheme() {

  const nextTheme = effectiveTheme();

  document.documentElement.dataset.theme = nextTheme;

  if (nextTheme !== currentTheme) {

    currentTheme = nextTheme;

    map.setStyle(
      currentTheme === "dark"
        ? DARK_MAP
        : LIGHT_MAP
    );

  }

}

themeSelect.addEventListener("change", () => {

  themePreference = themeSelect.value;

  try {
    localStorage.setItem(
      "socialscran-theme",
      themePreference
    );
  } catch (error) {}

  applyTheme();

});

systemTheme.addEventListener("change", () => {

  if (themePreference === "system") {
    applyTheme();
  }

});

function setStatus(message) {

  statusBox.textContent = message;

  statusBox.style.display =
    message ? "block" : "none";

}

function safeHttpUrl(value) {

  try {

    const url = new URL(value);

    if (
      url.protocol === "https:" ||
      url.protocol === "http:"
    ) {
      return url.href;
    }

  } catch (error) {}

  return "";

}

function validVideo(video) {

  if (
    video.approved !== true ||
    !video.creators ||
    video.creators.approved !== true
  ) {
    return false;
  }

  const id = String(
    video.platform_video_id || ""
  );

  if (video.platform === "tiktok") {
    return /^\d+$/.test(id);
  }

  if (video.platform === "instagram") {
    return false;
  }

  return false;

}

async function loadRestaurants() {

  setStatus("Loading restaurants...");

  try {

    const query =
      "restaurants?select=*,video_reviews(*,creators(*))&approved=eq.true";

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/" + query,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Accept: "application/json"
        },
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        "Database request failed: " + response.status
      );
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error("Unexpected database response");
    }

    restaurants = data
      .filter(item =>
        item.approved === true &&
        item.latitude !== null &&
        item.longitude !== null &&
        Number.isFinite(Number(item.latitude)) &&
        Number.isFinite(Number(item.longitude)) &&
        Math.abs(Number(item.latitude)) <= 90 &&
        Math.abs(Number(item.longitude)) <= 180
      )
      .map(item => ({
        ...item,
        lat: Number(item.latitude),
        lng: Number(item.longitude),
        videos: (item.video_reviews || [])
          .filter(validVideo)
      }))
      .filter(item => item.videos.length > 0);

    databaseReady = true;
    renderTagButtons();
    databaseFailed = false;

    renderMarkers();

    console.log(
      "SocialScran database connected:",
      restaurants.length,
      "restaurants"
    );

  } catch (error) {

    databaseFailed = true;

    console.error(
      "SocialScran database error:",
      error
    );

    setStatus(
      "Unable to load restaurants. Please refresh and try again."
    );

  }

}

function renderTagButtons() {
  const box = document.getElementById("tag-buttons"); box.replaceChildren();
  const available = [...new Set(restaurants.flatMap(r=>tagsFrom(r.category)))].sort();
  for (const tag of available) { const b=document.createElement("button"); b.className="pill"+(selectedTags.has(tag)?" active":""); b.textContent=tag; b.setAttribute("aria-pressed",String(selectedTags.has(tag))); b.onclick=()=>{selectedTags.has(tag)?selectedTags.delete(tag):selectedTags.add(tag);renderTagButtons();renderMarkers();};box.append(b); }
}
document.getElementById("clear-tags").onclick=()=>{selectedTags.clear();renderTagButtons();renderMarkers();};
function filteredRestaurants() {

  const term = search.value
    .trim()
    .toLowerCase();

  return restaurants.filter(restaurant => {

    const matchesCity =
      selectedCity === "All" ||
      restaurant.city === selectedCity;

    const searchableText = [
      restaurant.name,
      restaurant.city,
      restaurant.category,
      restaurant.address,
      restaurant.postcode
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

    return matchesCity && searchableText.includes(term) && (!selectedTags.size || tagsFrom(restaurant.category).some(t=>selectedTags.has(t)));

  });

}

function renderMarkers() {

  if (!mapReady || !databaseReady) return;

  markers.forEach(item => item.marker.remove());

  markers = [];

  const filtered = filteredRestaurants();

  const groups = [];
  for (const restaurant of filtered) {
    const point = map.project([restaurant.lng, restaurant.lat]);
    const group = map.getZoom() < 17 && groups.find(g => Math.hypot(g.x-point.x,g.y-point.y) < 38);
    if (group) group.items.push(restaurant);
    else groups.push({x:point.x,y:point.y,items:[restaurant]});
  }
  groups.forEach(group => {
    const restaurant = group.items[0];
    if (group.items.length > 1) {
      const element = document.createElement("button");
      element.type = "button";
      element.className = "restaurant-cluster";
      element.textContent = group.items.length;
      element.setAttribute("aria-label", `${group.items.length} restaurants; zoom in`);
      element.addEventListener("click", event => {
        event.stopPropagation();
        map.easeTo({center:[restaurant.lng,restaurant.lat],zoom:Math.min(17,map.getZoom()+2),duration:450});
      });
      const marker = new maplibregl.Marker({element,anchor:"center"}).setLngLat([restaurant.lng,restaurant.lat]).addTo(map);
      markers.push({marker,element,restaurant});
      return;
    }

    const element = document.createElement("button");

    element.className = "restaurant-marker";

    element.style.setProperty("--pin-color", ({standard:"#9ca3af",popular:"#ff7540",trending:"#ef4444",featured:"#fbbf24"})[restaurant.popularity] || "#9ca3af");

    element.type = "button";

    element.setAttribute(
      "aria-label",
      restaurant.name
    );

    if (
      restaurant.popularity === "popular" ||
      restaurant.popularity === "featured"
    ) {
      element.classList.add("popular");
    }

    if (
      selectedRestaurant &&
      selectedRestaurant.id === restaurant.id
    ) {
      element.classList.add("selected");
    }

    element.addEventListener("click", event => {

      event.stopPropagation();

      openRestaurant(restaurant);

    });

    const marker = new maplibregl.Marker({
      element: element, anchor: "bottom"
    })
      .setLngLat([
        restaurant.lng,
        restaurant.lat
      ])
      .addTo(map);

    markers.push({
      marker,
      element,
      restaurant
    });

  });

  if (!filtered.length) {

    setStatus(
      search.value.trim()
        ? "No matching restaurants found."
        : "No restaurants available in this area yet."
    );

  } else {

    setStatus("");

  }

}

function selectCity(city) {

  selectedCity = city;

  search.value = "";

  document.querySelectorAll("[data-city]")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.city === city
      );

    });

  closePanel();

  renderMarkers();

  map.flyTo({
    center: cities[city].center,
    zoom: cities[city].zoom,
    duration: 1000
  });

}

document.querySelectorAll("[data-city]")
  .forEach(button => {

    button.addEventListener("click", () => {
      selectCity(button.dataset.city);
    });

  });

search.addEventListener("input", () => {

  selectedCity = "All";

  document.querySelectorAll("[data-city]")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.city === "All"
      );

    });

  closePanel();
  renderMarkers();

});

search.addEventListener("keydown", event => {

  if (event.key !== "Enter") return;

  const term = search.value
    .trim()
    .toLowerCase();

  const city = Object.keys(cities).find(
    name => name.toLowerCase() === term
  );

  if (city) {

    selectCity(city);
    search.blur();
    return;

  }

  const results = filteredRestaurants();

  if (results.length === 1) {

    openRestaurant(results[0]);

  } else if (results.length > 1) {

    const bounds = new maplibregl.LngLatBounds();

    results.forEach(restaurant => {
      bounds.extend([
        restaurant.lng,
        restaurant.lat
      ]);
    });

    map.fitBounds(bounds, {
      padding: 80,
      maxZoom: 15
    });

  }

  search.blur();

});

function addDetail(parent, text, className = "detail") {

  const element = document.createElement("div");

  element.className = className;

  element.textContent = text;

  parent.appendChild(element);

}

function isDemoRestaurant(restaurant) {

  const text = [
    restaurant.name,
    restaurant.address,
    restaurant.description
  ]
    .filter(Boolean)
    .join(" ");

  return /\bdemo\b|\btest restaurant\b/i.test(text);

}

function openRestaurant(restaurant) {

  selectedRestaurant = restaurant;
  shuffledVideos = [...restaurant.videos];
  for(let i=shuffledVideos.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffledVideos[i],shuffledVideos[j]]=[shuffledVideos[j],shuffledVideos[i]];}

  selectedPlatform = restaurant.videos.some(
    video => video.platform === "tiktok"
  ) ? "tiktok" : "instagram";

  document.getElementById("restaurant-name")
    .textContent = restaurant.name;

  document.getElementById("restaurant-category")
    .textContent = [
      restaurant.city,
      restaurant.category
    ]
      .filter(Boolean)
      .join(" · ");

  const details =
    document.getElementById("restaurant-details");

  details.replaceChildren();

  if (restaurant.address) {

    addDetail(
      details,
      "📍 " + [
        restaurant.address,
        restaurant.postcode
      ].filter(Boolean).join(", ")
    );

  }

  addDetail(
    details,
    "🕒 " + (
      restaurant.opening_hours ||
      "Opening times not yet verified"
    )
  );

  if (isDemoRestaurant(restaurant)) {

    addDetail(
      details,
      "Demo location — address not yet verified.",
      "demo-note"
    );

  } else {

    if (restaurant.description) {

      addDetail(
        details,
        restaurant.description
      );

    }

    const directions =
      document.createElement("a");

    directions.className = "directions";

    directions.textContent = "➤ Get directions";

    directions.href =
      "https://www.google.com/maps/dir/?api=1&destination=" +
      encodeURIComponent(
        [restaurant.name, restaurant.address, restaurant.city, restaurant.postcode].filter(Boolean).join(", ")
      );

    directions.target = "_blank";

    directions.rel = "noopener noreferrer";

    details.appendChild(directions);

  }

  const websiteUrl =
    safeHttpUrl(restaurant.website_url);

  if (websiteUrl) {

    const website =
      document.createElement("a");

    website.className = "website-link";
    website.textContent = "Visit restaurant website ↗";
    website.href = websiteUrl;
    website.target = "_blank";
    website.rel = "noopener noreferrer";

    details.appendChild(website);

  }

  panel.classList.remove("short", "tall");
  panel.classList.add("open");

  panelContent.scrollTop = 0;

  markers.forEach(item => {

    item.element.classList.toggle(
      "selected",
      item.restaurant.id === restaurant.id
    );

  });

  updateVideoFilters();
  renderVideos();

  const mobile = window.innerWidth <= 700;

  map.flyTo({
    center: [
      restaurant.lng,
      restaurant.lat
    ],
    zoom: Math.max(map.getZoom(), 14),
    offset: mobile ? [0, -100] : [-120, 0],
    duration: 800
  });

}

function closePanel() {

  panel.classList.remove(
    "open",
    "short",
    "tall"
  );

  videoGrid.replaceChildren();

  selectedRestaurant = null;

  markers.forEach(item => {

    item.element.classList.remove("selected");

  });

}

document.getElementById("close-panel")
  .addEventListener("click", closePanel);

document.getElementById("resize-panel")
  .addEventListener("click", () => {

    if (panel.classList.contains("tall")) {

      panel.classList.remove("tall");
      panel.classList.add("short");

    } else if (panel.classList.contains("short")) {

      panel.classList.remove("short");

    } else {

      panel.classList.add("tall");

    }

  });

const dragArea =
  document.getElementById("drag-area");

let dragStart = null;

dragArea.addEventListener("pointerdown", event => {

  dragStart = event.clientY;

  dragArea.setPointerCapture(event.pointerId);

});

dragArea.addEventListener("pointerup", event => {

  if (dragStart === null) return;

  const distance = event.clientY - dragStart;

  if (distance < -40) {

    if (panel.classList.contains("short")) {

      panel.classList.remove("short");

    } else {

      panel.classList.add("tall");

    }

  } else if (distance > 40) {

    if (panel.classList.contains("tall")) {

      panel.classList.remove("tall");

    } else if (panel.classList.contains("short")) {

      if (distance > 100) {
        closePanel();
      }

    } else {

      panel.classList.add("short");

    }

  }

  dragStart = null;

});

dragArea.addEventListener("pointercancel", () => {
  dragStart = null;
});

function updateVideoFilters() {

  document.querySelectorAll("[data-platform]")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.platform === selectedPlatform
      );

    });

}

document.querySelectorAll("[data-platform]")
  .forEach(button => {

    button.addEventListener("click", () => {

      selectedPlatform = button.dataset.platform;

      updateVideoFilters();

      renderVideos();

    });

  });

function embedUrl(video) {

  const id = encodeURIComponent(
    video.platform_video_id
  );

  if (video.platform === "tiktok") {

    return "https://www.tiktok.com/player/v1/" +
      id +
      "?autoplay=0" +
      "&controls=1" +
      "&progress_bar=1" +
      "&play_button=1" +
      "&volume_control=1" +
      "&fullscreen_button=1" +
      "&timestamp=0" +
      "&loop=0" +
      "&music_info=0" +
      "&description=0" +
      "&rel=0";

  }

  return "https://www.instagram.com/reel/" +
    id + "/embed/";

}

function originalUrl(video) {

  const id = encodeURIComponent(
    video.platform_video_id
  );

  if (video.platform === "instagram") {

    return "https://www.instagram.com/reel/" +
      id + "/";

  }

  const username = String(
    video.creators?.tiktok_username || ""
  ).replace(/^@/, "");

  if (/^[A-Za-z0-9_.]+$/.test(username)) {

    return "https://www.tiktok.com/@" +
      username + "/video/" + id;

  }

  return "https://www.tiktok.com/video/" + id;

}

function createIframe(video) {

  const iframe = document.createElement("iframe");

  iframe.src = embedUrl(video);

  iframe.title =
    (video.creators?.display_name || "Creator") +
    " video review";

  iframe.allow =
    "autoplay; encrypted-media; fullscreen; picture-in-picture";

  iframe.allowFullscreen = true;

  iframe.loading = "lazy";

  return iframe;

}

function renderVideos() {

  videoGrid.replaceChildren();

  if (!selectedRestaurant) return;

  const allVideos = shuffledVideos;

  const visibleVideos =
    selectedPlatform === "all"
      ? allVideos
      : allVideos.filter(
          video => video.platform === selectedPlatform
        );

  document.getElementById("video-count")
    .textContent =
      visibleVideos.length +
      (visibleVideos.length === 1 ? " video" : " videos");

  if (!visibleVideos.length) {

    addDetail(
      videoGrid,
      "No reviews on this platform yet.",
      "empty"
    );

    return;

  }

  visibleVideos.forEach(video => {

    const card = document.createElement("article");

    card.className = "video-card";

    const frame = document.createElement("div");

    frame.className = "video-frame";

    frame.appendChild(createIframe(video));

    card.appendChild(frame);

    const info = document.createElement("div");

    info.className = "video-info";

    const creator = video.creators || {};

    addDetail(
      info,
      (creator.display_name || "Food creator") +
      (creator.verified ? " ✓" : ""),
      "creator-name"
    );

    addDetail(
      info,
      video.platform === "tiktok"
        ? "TikTok"
        : "Instagram",
      "platform-label"
    );

    const actions = document.createElement("div");

    actions.className = "video-actions";

    const expand = document.createElement("button");

    expand.className = "expand-button";

    expand.textContent = "⛶ Expand video";

    expand.addEventListener("click", () => {

      openVideo(video);

    });

    const original = document.createElement("a");

    original.className = "original-link";

    original.textContent = "Watch original ↗";

    original.href = originalUrl(video);

    original.target = "_blank";

    original.rel = "noopener noreferrer";

    actions.append(expand, original);

    info.appendChild(actions);

    card.appendChild(info);

    videoGrid.appendChild(card);

  });

}

let previousFocus = null;

function openVideo(video) {

  previousFocus = document.activeElement;

  videoGrid.replaceChildren();

  panel.inert = true;

  document.querySelector(".top-ui").inert = true;

  document.getElementById("map").inert = true;

  document.getElementById("modal-title")
    .textContent =
      video.creators?.display_name || "Video review";

  document.getElementById("modal-original")
    .href = originalUrl(video);

  const player =
    document.getElementById("modal-player");

  player.replaceChildren(createIframe(video));

  videoModal.classList.add("open");

  document.getElementById("modal-close").focus();

}

function closeVideo() {

  videoModal.classList.remove("open");

  document.getElementById("modal-player")
    .replaceChildren();

  panel.inert = false;

  document.querySelector(".top-ui").inert = false;

  document.getElementById("map").inert = false;

  renderVideos();

  if (previousFocus?.isConnected) {

    previousFocus.focus();

  } else {

    document.getElementById("close-panel").focus();

  }

}

document.getElementById("modal-close")
  .addEventListener("click", closeVideo);

document.addEventListener("keydown", event => {

  if (event.key !== "Escape") return;

  if (videoModal.classList.contains("open")) {

    closeVideo();

  } else if (panel.classList.contains("open")) {

    closePanel();

  }

});

window.addEventListener("resize", () => {

  map.resize();

});

setTimeout(() => {

  if (!mapReady) {

    document.getElementById("map-error")
      .style.display = "block";

  }

}, 20000);

loadRestaurants();


const filterToggle=document.getElementById("filter-toggle"), infoToggle=document.getElementById("info-toggle"), filterMenu=document.getElementById("filter-menu"), mapInfo=document.getElementById("map-info");
function showMenu(which){filterMenu.hidden=which!=="filter";mapInfo.hidden=which!=="info";filterToggle.setAttribute("aria-expanded",String(!filterMenu.hidden));infoToggle.setAttribute("aria-expanded",String(!mapInfo.hidden));}
filterToggle.addEventListener("click",()=>showMenu(filterMenu.hidden?"filter":null));infoToggle.addEventListener("click",()=>showMenu(mapInfo.hidden?"info":null));document.getElementById("filter-done").addEventListener("click",()=>showMenu(null));document.addEventListener("pointerdown",e=>{if(!e.target.closest(".top-ui"))showMenu(null);});document.addEventListener("keydown",e=>{if(e.key==="Escape")showMenu(null);});
</script>

</body>
